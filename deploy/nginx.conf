# HTTPS front for the board: static page behind a session check, API proxied to loopback.
server { listen 80; server_name board.example.com; return 301 https://$host$request_uri; }
server {
  listen 443 ssl; http2 on; server_name board.example.com;
  ssl_certificate /etc/nginx/tls/board.crt; ssl_certificate_key /etc/nginx/tls/board.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /var/www/board; index index.html;   # match `out` in config.toml
  add_header Cache-Control "no-store" always; add_header X-Robots-Tag "noindex" always;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Real-IP $remote_addr;
  location = /_auth { internal; proxy_pass http://127.0.0.1:8787/api/auth/check; proxy_pass_request_body off; proxy_set_header Content-Length ""; }
  location = /signin { proxy_pass http://127.0.0.1:8787; }
  location = /api/signin { proxy_pass http://127.0.0.1:8787; }
  location = /api/signout { proxy_pass http://127.0.0.1:8787; }
  location /api/ { auth_request /_auth; proxy_pass http://127.0.0.1:8787; }
  location / { auth_request /_auth; error_page 401 = @signin; try_files $uri $uri/ =404; }
  location @signin { return 302 /signin; }
}
